# Full ml-25m scale run (two-tower -> LambdaMART).
# `max_users` subsamples users so the run stays tractable on a laptop while
# using the full 25M-derived item catalog and popularity. Remove it for the
# complete dataset.
seed: 42

data:
  small: false             # ml-25m
  positive_threshold: 4.0
  min_interactions: 10
  n_test: 3
  n_valid: 3
  max_users: 20000
  confidence: linear
  alpha: 2.0

retrieval:
  model: two_tower
  params:
    dim: 128
    hidden: 256
    epochs: 10
    batch_size: 4096
    lr: 0.01
    temperature: 0.1
    logq_correction: true
    weight_decay: 1.0e-5
    seed: 42

ranking:
  model: lambdamart
  params:
    num_leaves: 63
    learning_rate: 0.05
    n_estimators: 500
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    eval_at: [10]
    seed: 42

ranker_train:
  k_neg: 4
  hard_fraction: 0.5

eval:
  ks: [5, 10, 20]
  recall_ks: [100, 200]
  n_negatives: 200
  cold_threshold: 20

output:
  artifacts_dir: artifacts
  results_dir: results
  save_serving: false
